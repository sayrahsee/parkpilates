<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact - Park Pilates SF</title>
  <link
    href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
    rel="stylesheet"
  />
  <style>
    body {
      background-color: white;
      color: #1a202c; /* Tailwind gray-800 */
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Header (reuse from index.html) -->
  <header class="bg-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="index.html" class="flex items-center space-x-2">
        <img src="logo.jpg" alt="ParkPilates Logo" class="logo" style="width: 150px; height: auto;" />
        <span class="text-xl font-semibold">Park Pilates</span>
      </a>
      <nav class="space-x-6 hidden md:flex text-sm font-medium items-center">
        <a href="index.html" class="hover:text-black">Home</a>
        <a href="about.html" class="hover:text-black">About</a>
        <a href="contact.html" class="hover:text-black font-bold">Contact</a>
        <a href="book.html"
           class="ml-4 px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700 transition">
          Book a Class
        </a>
      </nav>
      <button id="mobile-menu-button" class="md:hidden focus:outline-none">
        <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2"
          viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
    </div>
    <div id="mobile-menu" class="md:hidden hidden px-4 pb-4 space-y-2">
      <a href="index.html" class="block">Home</a>
      <a href="about.html" class="block">About</a>
      <a href="contact.html" class="block font-bold">Contact</a>
      <a href="book.html" 
         class="block px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700 transition">
        Book a Class
      </a>
    </div>
  </header>

  <!-- Contact Section -->
  <main class="flex-grow max-w-xl mx-auto px-6 py-12">
    <h1 class="text-3xl font-bold mb-6 text-center">Contact Us</h1>

    <form action="https://formspree.io/f/your-form-id" method="POST" class="space-y-6">
      <label class="block">
        <span class="text-gray-700">Name</span>
        <input type="text" name="name" required
          class="mt-1 block w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-500" />
      </label>

      <label class="block">
        <span class="text-gray-700">Email</span>
        <input type="email" name="_replyto" required
          class="mt-1 block w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-500" />
      </label>

      <label class="block">
        <span class="text-gray-700">Message</span>
        <textarea name="message" rows="5" required
          class="mt-1 block w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-500"></textarea>
      </label>

      <button type="submit"
        class="w-full bg-green-600 text-white font-semibold py-3 rounded hover:bg-green-700 transition">
        Send Message
      </button>
    </form>
  </main>

  <footer class="bg-gray-100 text-center py-4 text-sm text-gray-500">
    &copy; 2025 Park Pilates SF. All rights reserved.
  </footer>

  <script>
    document.getElementById('mobile-menu-button').addEventListener('click', function () {
      document.getElementById('mobile-menu').classList.toggle('hidden');
    });
  </script>
</body>
</html>
