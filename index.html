<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Park Pilates SF</title>
  <link rel="icon" type="image/png" href="assets/images/logo.png" />
  <link
    href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
    rel="stylesheet"
  />
  <style>
    /* Resize the logo */
    .logo {
      width: 100px;
      height: auto; /* keep aspect ratio */
    }
  </style>
</head>


<body class="bg-white text-gray-800">

  <!-- Header -->
<section class="text-center py-20 px-6">
  <h1 class="text-4xl font-bold mb-4">Welcome to Park Pilates</h1>
  <p class="text-lg text-gray-600 mb-6">Outdoor movement. Real community. Stronger together.</p>

  <!-- Book a Class CTA button only visible on mobile -->
  <a href="book.html"
     class="inline-block px-8 py-3 bg-green-600 text-white rounded text-lg font-semibold hover:bg-green-700 transition md:hidden mx-auto">
    Book a Class
  </a>
</section>


      <!-- Nav -->
<nav class="space-x-6 hidden md:flex text-sm font-medium items-center">
  <a href="index.html" class="hover:text-black">Home</a>
  <a href="about.html" class="hover:text-black">About</a>
  <a href="contact.html" class="hover:text-black">Contact</a>
  <a href="book.html" 
     class="ml-4 px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700 transition">
    Book a Class
  </a>
</nav>


      <!-- Hamburger (Mobile) -->
      <button id="mobile-menu-button" class="md:hidden focus:outline-none">
        <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2"
          viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
    </div>

   <!-- Mobile Menu -->
<div id="mobile-menu" class="md:hidden hidden px-4 pb-4 space-y-2">
  <a href="index.html" class="block">Home</a>
  <a href="about.html" class="block">About</a>
  <a href="contact.html" class="block">Contact</a>
  <a href="book.html" 
     class="block px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700 transition">
    Book a Class
  </a>
</div>

  <!-- Hero Section -->
  <section class="text-center py-20 px-6">
    <h1 class="text-4xl font-bold mb-4">Welcome to Park Pilates</h1>
    <p class="text-lg text-gray-600">Outdoor movement. Real community. Stronger together.</p>
  </section>

  <!-- Footer -->
  <footer class="bg-gray-100 text-center py-4 text-sm text-gray-500">
    &copy; 2025 Park Pilates SF. All rights reserved.
  </footer>

  <!-- JS for mobile menu toggle -->
  <script>
    document.getElementById('mobile-menu-button').addEventListener('click', function () {
      document.getElementById('mobile-menu').classList.toggle('hidden');
    });
  </script>

</body>
</html>
