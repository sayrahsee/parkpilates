<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Park Pilates</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer>
    function toggleMenu() {
      document.getElementById('mobile-menu').classList.toggle('hidden');
    }
  </script>
 <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body class="bg-white text-gray-800 flex flex-col min-h-screen">

  <!-- Header -->
  <header class="w-full px-6 py-4 flex justify-between items-center shadow-md">
    <a href="index.html" class="flex items-center space-x-2">
<img src="logo.jpg" alt="Park Pilates Logo" class="w-[120px] h-auto" />
      <span class="text-2xl font-bold"></span>
    </a>
    <nav class="hidden md:flex space-x-6">
      <a href="index.html" class="hover:text-green-600">Home</a>
      <a href="about.html" class="hover:text-green-600">About</a>
      <a href="contact.html" class="hover:text-green-600">Contact</a>
    </nav>
    <!-- Hamburger Button -->
    <button class="md:hidden focus:outline-none" onclick="toggleMenu()">
      <svg class="w-6 h-6 text-gray-800" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>
  </header>

  <!-- Mobile Menu -->
  <div id="mobile-menu" class="md:hidden hidden flex-col px-6 pb-4 space-y-2">
    <a href="about.html" class="block text-gray-700 hover:text-green-600">About</a>
    <a href="contact.html" class="block text-gray-700 hover:text-green-600">Contact</a>

  </div>

  <!-- Hero Section -->
  <section class="flex-grow text-center py-20 px-6 bg-gray-100">
    <h1 class="text-4xl md:text-5xl font-bold mb-4">Welcome to Park Pilates</h1>
    <p class="text-lg md:text-xl text-gray-600 mb-6">Outdoor movement. Real community. Stronger together.</p>
    <a href="book.html" class="inline-block px-8 py-3 bg-green-600 text-white rounded text-lg font-semibold hover:bg-green-700 transition">
      Book a Class
    </a>
    <!-- Social Icons -->
  <div class="flex justify-center space-x-8 text-gray-700 text-3xl">
    <a href="https://www.instagram.com/parkpilatessf" target="_blank" aria-label="Instagram" class="hover:text-[#C13584]">
      <i class="fab fa-instagram"></i>
    </a>
   <a href="https://www.tiktok.com/@parkpilatessf" target="_blank" aria-label="TikTok" class="hover:text-black">
  <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24" class="w-10 h-10">
    <path d="M9.5 7.98v7.19a4.5 4.5 0 1 1-4.5-4.5v-1.56a6.01 6.01 0 0 0 4.5 1.87z"/>
    <path d="M18 6.5h-2a5 5 0 0 1-5-5v2a3 3 0 0 0 3 3h4v5a4 4 0 0 0 4 4h2a6 6 0 0 1-6-6v-3.5z"/>
  </svg>
</a>

  </div>
  </section>

  <!-- Footer -->
  <footer class="bg-gray-800 text-white py-6 mt-auto">
    <div class="max-w-5xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center space-y-4 md:space-y-0">
      <p>&copy; 2025 Park Pilates. All rights reserved.</p>

      </div>
    </div>
  </footer>

</body>
</html>
